version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
  exclusions:
    generated: strict
    paths:
      - ".*_templ\\.go$"
formatters:
  enable:
    - gofmt
    - goimports
