name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openshelf
          POSTGRES_PASSWORD: openshelf
          POSTGRES_DB: openshelf
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U openshelf"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
      - run: make check

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker buildx build --load -t openshelf:ci --cache-from type=gha --cache-to type=gha,mode=max .
      - name: Backup/restore round trip
        run: SKIP_BUILD=1 scripts/backup-restore-test.sh
      - name: Resource budget
        run: SKIP_BUILD=1 scripts/resource-budget.sh
