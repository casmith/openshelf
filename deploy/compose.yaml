name: openshelf

services:
  app:
    image: ${OPENSHELF_IMAGE:-ghcr.io/casmith/openshelf:latest}
    build: ..
    restart: unless-stopped
    env_file: ${OPENSHELF_ENV_FILE:-.env}
    environment:
      OPENSHELF_DATABASE_URL: ${OPENSHELF_DATABASE_URL:-postgres://openshelf:${POSTGRES_PASSWORD}@postgres:5432/openshelf?sslmode=disable}
      OPENSHELF_LISTEN: ":8080"
      OPENSHELF_DATA_DIR: /data
    ports:
      - "${OPENSHELF_HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/openshelf", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: openshelf
      POSTGRES_DB: openshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshelf -d openshelf"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 5

  # Used by scripts/backup.sh and scripts/restore.sh to read and write the data volume.
  toolbox:
    image: postgres:18
    profiles: [tools]
    entrypoint: []
    command: ["true"]
    volumes:
      - data:/data

volumes:
  pgdata:
  data:
