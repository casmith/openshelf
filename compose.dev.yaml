name: openshelf-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: openshelf
      POSTGRES_PASSWORD: openshelf
      POSTGRES_DB: openshelf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshelf"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
